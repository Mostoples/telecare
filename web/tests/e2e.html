<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>TeleCare — uji e2e</title>
<style>
  body { margin: 0; font: 13px/1.5 Consolas, monospace; background: #0b1512; color: #cfe; }
  #panggung { position: fixed; right: 0; top: 0; width: 430px; height: 900px; border: 0;
              background: #fff; }
  #hasil { padding: 12px 16px; margin: 0; white-space: pre-wrap; max-width: calc(100% - 460px); }
  .ok { color: #7ee0a8 } .gagal { color: #ff8a7a } .info { color: #8ab }
</style>
</head>
<body>
<!--
  Uji ujung-ke-ujung aplikasi TeleCare.

  Aplikasi dimuat di dalam iframe SAME-ORIGIN, lalu dikendalikan seperti pengguna:
  mengklik tombol sungguhan, mengetik ke kolom sungguhan, membaca DOM hasilnya.
  Tidak memanggil fungsi internal untuk "memalsukan" keberhasilan — kecuali untuk
  menyiapkan keadaan awal (mis. mengosongkan penyimpanan).

  Jalankan (server lokal harus hidup):
    python tools/serve.py 8950
    powershell -File tools/uji-e2e.ps1

  Atau buka http://127.0.0.1:8950/tests/e2e.html di peramban biasa untuk menonton.
  Hasil akhir berupa baris "RINGKAS lulus=N gagal=M" yang dibaca skrip runner.
-->
<iframe id="panggung" title="aplikasi yang diuji"></iframe>
<pre id="hasil"></pre>
<script src="e2e.js"></script>
</body>
</html>
